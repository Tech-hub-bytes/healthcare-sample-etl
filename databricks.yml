bundle:
  name: healthcare_sample_etl

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for ETL outputs
    default: workspace
  schema:
    description: Unity Catalog schema for ETL outputs
    default: default
  source_table:
    description: Synthetic healthcare claims source table
    default: samples.healthverity.claims_sample_synthetic

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: dbc-7c3eed4c
      host: https://dbc-7c3eed4c-66bb.cloud.databricks.com
    variables:
      catalog: workspace
      schema: default
